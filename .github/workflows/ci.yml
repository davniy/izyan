name: CI

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Public OSS CI uses only repository fixtures and publicly available
  # VEX-Bench material. Private heldout/corporate census corpora are not
  # provisioned or required here; run those gates in a separate environment.
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      # The compiled CLI preservation matrix invokes Python's offline
      # controller tests through `python3 -m pytest`. Go alone is not a
      # complete test environment for the merged A/B workflow.
      - name: Set up Python test runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install 'pytest>=8,<10'

      # Legacy source has outstanding formatting debt, and testdata contains
      # intentionally invalid Go programs. Enforce formatting on every
      # Go source changed by this event without rewriting unrelated code.
      - name: Verify changed Go formatting (gofmt)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            before="${{ github.event.pull_request.base.sha }}"
          else
            before="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before="$(git rev-parse HEAD^)"
          fi
          unformatted=$(git diff --name-only --diff-filter=ACMR "$before" HEAD -- '*.go' | awk '$0 !~ /(^|\/)testdata\//' | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # Merged gate: canonical kernel + evidence tools + the whole
      # Product B adapter lane (triage, claimshape, verify, heldoutgate,
      # research lane, deployment) + all CLI binaries. The adapter
      # boundary guard lives inside internal/productb tests.
      - name: Run tests
        run: |
          go test -count=1 ./internal/goanalysis ./internal/evidencetools ./internal/productb/... ./cmd/...
          go test -v ./...

      - name: Run offline evaluation controller tests
        run: python3 -m pytest eval/decision_ready -q

  # Blocking gate on protected branches: the adapter boundary, schema
  # registry and the product's deterministic policy surface (exit codes,
  # false-safe/unverified baselines, final-attempt persistence, stable
  # provenance pins) must hold before merge. Split from `test` so a
  # boundary or policy regression never rides in on a green kernel.
  boundary-gate:
    name: Adapter boundary, schema & policy determinism (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      # D17 mechanical pin: productb never imports internal/domain,
      # internal/affected, internal/evaluator, agenttriage or the
      # Product A internal/research lane; the schema registry must be
      # complete (S-17).
      - name: Run boundary tests
        run: go test -count=1 -run 'TestS12|TestNoSecondAuthorityContract|TestSchemaRegistry|TestProposalCannotSetAuthorityFields' ./internal/productb/...
      # Policy-determinism half of the split: falsifier admission against
      # the run-pinned catalog, partial-binding rejection, stability
      # provenance and the decision/exit-code surface.
      - name: Run policy determinism tests
        run: >-
          go test -count=1 -run
          'TestConditionCatalog|TestAdmitFalsifierProposal|TestCheckCatalogRejectsPartialBinding|TestIngestProposalRejectsPartialRunIdentity|TestComposerDemotesUnstableVerifiedProof|TestFalsifierVerifierUsesCurrentStabilityAttempt|TestMandatoryConditionSource|TestDecisionMarkdownDeterministic'
          ./internal/productb/triage
      # Kernel parity half (port review item 7): blocking fixtures for
      # LIVE/UNKNOWN/PARTIAL/skipped/open-dispatch states plus the
      # code-absence admission chain and the symbol-unreachability payload
      # parity against the real kernel wire shape.
      - name: Run kernel parity tests
        run: go test -count=1 -run 'TestKernelParity|TestGateFalsifierProposals|TestCatalogBinding|TestReplay.*Catalog' ./internal/productb/triage

  # Compile + vet the offline evaluator without loading any external corpus.
  heldout-build:
    name: Heldout gate compile (always on)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Vet heldout gate
        run: go vet ./cmd/izyan-heldout-gate ./internal/productb/heldoutgate
      - name: Compile heldout gate
        run: go build -o /tmp/izyan-heldout-gate ./cmd/izyan-heldout-gate

  build-check:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: izyan-linux-amd64
          - goos: darwin
            goarch: arm64
            binary: izyan-darwin-arm64
          - goos: windows
            goarch: amd64
            binary: izyan-windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Compile binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=ci-${{ github.sha }} -X main.Commit=${{ github.sha }} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/${{ matrix.binary }} \
            ./cmd/izyan
